<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                border:1px solid black;
                margin-top:5cm;
                margin-bottom:5cm;
                margin-right:5cm;
                margin-left:5cm;
                background-color:lightblue;
            }
        </style>
    </head>
    <body>
        <h2>
            Using individual margin properties
        </h2>
        <div>
            This div element has a top margin of 100px, a right margin of 150px, a bottom margin of 100px, and a left margin of 80px.</div>
        </div>
    </body>
</html>
